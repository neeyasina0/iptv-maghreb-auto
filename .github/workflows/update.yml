name: Actualiser IPTV Maghreb

on:
  workflow_dispatch:
  schedule:
    - cron: '0 */6 * * *'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Recuperer le depot
        uses: actions/checkout@v4

      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Installer les dependances
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Actualiser la playlist
        run: python update_playlist.py

      - name: Enregistrer les modifications
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add maghreb.m3u maghreb-complet.m3u etat.json
          if ! git diff --cached --quiet; then
            git commit -m "Mise a jour automatique IPTV Maghreb"
            git push
          fi
